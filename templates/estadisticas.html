{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-10">
        <h2 class="fw-bold text-kliniv-oscuro mb-4"><i class="bi bi-bar-chart-fill me-2"></i>Panel de Estadísticas Kliniv</h2>
        
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm border-0 text-white text-center p-4 h-100" style="background-color: var(--kliniv-oscuro); border-radius: 15px;">
                    <h1 class="display-4 fw-bold">{{ total_consultas|default:"0" }}</h1>
                    <p class="mb-0">Consultas Totales Realizadas</p>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card shadow-sm border-0 p-4 h-100" style="border-radius: 15px; border-top: 4px solid var(--kliniv-claro) !important;">
                    <h5 class="fw-bold text-kliniv-oscuro mb-3">Síntomas más consultados</h5>
                    <canvas id="graficoSintomas" height="120"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const ctx = document.getElementById('graficoSintomas');
        
        // Creamos las listas vacías primero (Javascript puro, a VS Code le gusta esto)
        const nombresSintomas = [];
        const cantidades = [];

        // Llenamos las listas una por una usando Django
        {% for item in sintomas_frecuentes %}
            nombresSintomas.push("{{ item.sintoma__nombre|default:'Síntoma Eliminado'|escapejs }}");
            cantidades.push({{ item.total|default:0 }});
        {% endfor %}

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: nombresSintomas,
                datasets: [{
                    label: 'Número de Consultas',
                    data: cantidades,
                    backgroundColor: '#fe8eff', 
                    borderRadius: 5
                }]
            },
            options: {
                scales: { 
                    y: { 
                        beginAtZero: true,
                        ticks: { stepSize: 1 } 
                    } 
                }
            }
        });
    });
</script>
{% endblock %}
